{% extends "base.html" %}
{% block title %}RockQuest — Línea del tiempo{% endblock %}
{% block content %}
<section class="page-header">
    <div class="page-header-glass">
        <h1 class="page-title">Línea del <span>Tiempo</span></h1>
        <p class="page-subtitle">Los momentos puntuales que marcaron un antes y un después.</p>
    </div>
</section>

<section class="content-section">
    <div class="timeline-vertical">
        {% for hito in hitos %}
        <div class="timeline-item hvr-grow">
            <div class="timeline-dot"></div>
            <div class="timeline-item-content content-glass">
                <span class="timeline-anio">{{ hito.anio }}</span>
                <h3>{{ hito.titulo }}</h3>
                <p>{{ hito.descripcion }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
